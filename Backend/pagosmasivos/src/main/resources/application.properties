spring.application.name=switchpagos
server.port=${SERVER_PORT:8080}

spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:switch_banquito}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:switch_banquito}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:10MB}

management.endpoints.web.exposure.include=health,info

logging.level.org.springframework.web=${LOG_LEVEL_WEB:INFO}
logging.level.com.banquito.switchpagos=${LOG_LEVEL_APP:INFO}

switch.scheduler.cola.delay-ms=${SCHEDULER_COLA_DELAY_MS:60000}
