services:
  postgres:
    image: postgres:16-alpine
    container_name: switchpagos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-switch_banquito}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../DB/modeloFisicoBD_Switch_v4_postgresql.sql:/docker-entrypoint-initdb.d/01-modelo.sql:ro
      - ./docker/postgres/02-seed-dev.sql:/docker-entrypoint-initdb.d/02-seed-dev.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-switch_banquito}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: switchpagos-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-switch_banquito}
      DB_SCHEMA: ${DB_SCHEMA:-switch_banquito}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_PROFILES_ACTIVE: dev
      LOG_LEVEL_WEB: ${LOG_LEVEL_WEB:-INFO}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  postgres-data:
